# Single-user Nix inside an Android chroot. No daemon, no build users.
build-users-group =
# Samsung's kernel / Android SELinux make the Nix sandbox (user+mount+pid
# namespaces, pivot_root) a non-starter; KernelSU's su domain gets you root,
# not a sane sandbox. Builds run unsandboxed.
sandbox = false
# Android's seccomp + kernel config trip Nix's own syscall filter installer.
filter-syscalls = false
experimental-features = nix-command flakes
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
max-jobs = auto
cores = 0
# Phone storage: keep the store lean, don't pin build-time deps.
keep-outputs = false
keep-derivations = false
# f2fs on /data is fine with WAL; this just makes the intent explicit.
use-sqlite-wal = true
